[package]
name = "signalsmith-stretch-rs"
version = "1.3.2"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Safe Rust audio pitch/time stretching library"
readme = "README.md"
documentation = "https://docs.rs/signalsmith-stretch-rs"
keywords = ["audio", "pitch", "time-stretch", "dsp"]
categories = ["multimedia::audio"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "signalsmith_stretch"
path = "src/lib.rs"

[[bin]]
name = "stretch"
path = "src/bin/stretch.rs"
required-features = ["cli"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:hound"]

[dependencies]
hound = { version = "3.5.1", optional = true }
num-traits = "0.2.19"
rustfft = "6.4.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
