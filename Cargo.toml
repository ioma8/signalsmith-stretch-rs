[package]
name = "signalsmith-stretch-rs"
version = "1.3.2"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Safe Rust audio pitch/time stretching library"
readme = "README.md"
documentation = "https://docs.rs/signalsmith-stretch-rs"
keywords = ["audio", "pitch", "time-stretch", "dsp"]
categories = ["multimedia::audio"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "signalsmith_stretch"
path = "src/lib.rs"

[[bin]]
name = "stretch"
path = "src/bin/stretch.rs"
required-features = ["cli"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[features]
default = ["std"]
std = ["num-traits/std", "num-complex/std"]
libm = ["num-traits/libm", "num-complex/libm"]
no_std = ["libm"]
cli = ["dep:hound", "std"]

[dependencies]
hound = { version = "3.5.1", optional = true }
microfft = { version = "0.6.0", default-features = false, features = ["size-32768"] }
num-complex = { version = "0.4.6", default-features = false }
num-traits = { version = "0.2.19", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
